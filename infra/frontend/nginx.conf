worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;
    client_body_timeout 10s;
    gzip on;
    gzip_types text/css application/javascript application/json;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $request_id $problem_id { default $request_id; ~^(........)(....)(....)(....)(............)$ $1-$2-$3-$4-$5; }
    server {
        listen 8080;
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api_upstream api:8000;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        error_page 413 = @too_large;
        error_page 502 504 = @unavailable;
        location @too_large {
            default_type application/problem+json;
            add_header X-Correlation-ID $problem_id always;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
            return 413 '{"type":"urn:smartfan:problem:body-too-large","title":"Corpo da requisição excede o limite.","status":413,"detail":"Reduza o tamanho da requisição.","instance":"/api","code":"body_too_large","correlation_id":"$problem_id"}';
        }
        location @unavailable {
            default_type application/problem+json;
            add_header X-Correlation-ID $problem_id always;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
            return 503 '{"type":"urn:smartfan:problem:api-unavailable","title":"Serviço temporariamente indisponível.","status":503,"detail":"Tente novamente em instantes.","instance":"/api","code":"api_unavailable","correlation_id":"$problem_id"}';
        }
        location = /health { default_type text/plain; return 200 'healthy'; }
        location /api/ {
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 35s;
            proxy_connect_timeout 3s;
            proxy_buffering off;
        }
        location /ws {
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
