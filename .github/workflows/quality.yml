name: AIoT quality

on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**', 'ci/**', 'chore/**', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiot-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0, persist-credentials: false}
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          base=os.environ.get('BASE','')
          if re.fullmatch(r'[a-f0-9]{40}',base) and set(base)!={'0'}:
              files=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
              code=not files or any(not path.endswith('.md') for path in files)
          else:
              code=True
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('code='+str(code).lower()+'\n')
          PY

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.11.18'}
      - name: Versionable tree, with exact reviewed placeholder only
        run: python tools/quality/secret_scan.py tree
      - name: Complete history, including unresolved legacy findings
        run: python tools/quality/secret_scan.py strict-history
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: redacted-secret-audit
          path: evidence/security/*.json
          retention-days: 14

  quality:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.11.18'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24.22.2', cache: npm, cache-dependency-path: web-smart-fan-iot/frontend/package-lock.json}
      - name: Install pinned application and quality dependencies
        run: |
          python -m pip install -r web-smart-fan-iot/backend/requirements-dev.txt -e './packages/smartfan_common[reliability]'
          npm ci --prefix web-smart-fan-iot/frontend
          npx --prefix web-smart-fan-iot/frontend playwright install --with-deps chromium
      - name: Lint, types and generated contracts
        run: python tools/quality/check.py lint
      - name: Exercise failing gates locally
        run: python tools/quality/negative.py
      - name: Unit and legacy regression tests
        if: needs.scope.outputs.code == 'true'
        run: python tools/quality/check.py unit
      - name: Build, real integrations, browser, combined coverage, image scan
        if: needs.scope.outputs.code == 'true'
        run: python tools/quality/runtime.py
      - name: Dependency audit
        run: |
          python -m pip_audit -r web-smart-fan-iot/backend/requirements.lock --disable-pip --no-deps
          npm audit --prefix web-smart-fan-iot/frontend --audit-level=moderate
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: quality-evidence
          path: |
            evidence/coverage/summary.json
            evidence/coverage/python.json
            evidence/coverage/frontend.json
            evidence/security/images/summary.json
          retention-days: 14

  required-gate:
    needs: [scope, secrets, quality]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failed, cancelled or unexpectedly skipped required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json,os
          results=json.loads(os.environ['RESULTS'])
          failed=[name for name,result in results.items() if result['result']!='success']
          print('Required jobs not successful:',failed)
          raise SystemExit(bool(failed))
          PY
