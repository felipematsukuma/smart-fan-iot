[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartfan-common"
version = "0.1.0"
description = "Versioned AIoT wire contracts and causal HVAC features"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.14.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src"]
strict = true
