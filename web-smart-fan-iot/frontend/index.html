<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ventora — monitoramento em tempo real do ventilador inteligente."
    />
    <meta name="theme-color" content="#111c21" />
    <title>Ventora — Painel de Controle</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura para evitar flash.
      (function () {
        try {
          if (localStorage.getItem('ventora-theme') === 'light') {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          /* localStorage indisponível: mantém o tema escuro padrão */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
